<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - College Placement & Career Development Platform</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root { --auth-bg:#f7f3ee; --auth-surface:#fffaf6; --auth-plum:#5b3a70; --auth-mauve:#8e6ba8; --auth-coral:#e98b6a; --auth-muted:#746a75; --auth-border:#e7ddd8; }
        body.auth-page { color:#28232a; background:radial-gradient(ellipse at 8% 16%,#e7dced 0,transparent 34%),radial-gradient(ellipse at 92% 84%,#f6ddd3 0,transparent 32%),var(--auth-bg)!important; }
        .auth-nav { width:min(1180px,calc(100% - 32px)); margin:18px auto 0; padding:10px 18px; border:1px solid #e6dcd8; border-radius:22px; background:#fffaf4dc!important; backdrop-filter:blur(16px); }
        .auth-nav .navbar-brand { color:var(--auth-plum)!important; font-size:1.1rem; }
        .auth-nav .navbar-brand i { color:var(--auth-coral); }
        .auth-nav .nav-link { color:var(--auth-muted)!important; font-weight:600; }
        .auth-nav .nav-link:hover { color:var(--auth-plum)!important; }
        .auth-main { flex:1; display:flex; align-items:center; }
        .auth-main > .row { width:100%; }
        .auth-card { overflow:hidden; border:1px solid #e8ded9!important; border-radius:28px!important; background:#fffaf5ed; box-shadow:0 24px 70px #5b3a7017!important; }
        .auth-card .card-body { padding:clamp(1.5rem,5vw,3rem)!important; }
        .auth-mark { display:grid; place-items:center; width:58px; height:58px; margin:0 auto 18px; border-radius:20px; color:#fff; background:linear-gradient(145deg,var(--auth-mauve),var(--auth-plum)); box-shadow:0 12px 26px #5b3a702e; font-size:1.5rem; }
        .auth-eyebrow { color:var(--auth-mauve); font-size:.68rem; letter-spacing:.17em; font-weight:800; }
        .auth-card h1 { color:var(--auth-plum); letter-spacing:-.04em; }
        .auth-card p { color:var(--auth-muted)!important; }
        .auth-card .form-label { color:#403747; }
        .auth-card .input-group-text,.auth-card .form-control { min-height:48px; border-color:var(--auth-border); background:#fffdfa; }
        .auth-card .input-group-text { color:var(--auth-mauve)!important; }
        .auth-card .form-control:focus { border-color:var(--auth-mauve); box-shadow:0 0 0 .22rem #8e6ba826; }
        .auth-primary { border:0!important; border-radius:999px!important; color:white!important; background:linear-gradient(100deg,var(--auth-coral),#e77d69)!important; box-shadow:0 10px 24px #e98b6a38; }
        .auth-primary:hover { transform:translateY(-1px); }
        .auth-card .btn-outline-primary { color:var(--auth-plum); border-color:#c9b7d3; }
        .auth-card .btn-outline-primary:hover { color:#fff; background:var(--auth-plum); border-color:var(--auth-plum); }
        .auth-card .btn-outline-success { color:#58735a; border-color:#b9c9b6; }
        .auth-card .btn-outline-secondary { color:#746a75; border-color:#d8cfd5; }
        .auth-card a:not(.btn) { color:var(--auth-plum)!important; }
        .auth-card .border-top { border-color:var(--auth-border)!important; }
        @media(max-width:575px) { .auth-nav { margin-top:10px; } .auth-main { align-items:flex-start; } }
    </style>
</head>
<body class="auth-page auth-login">

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg auth-nav">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-stars me-2"></i>SkillBridge
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="bi bi-house me-1"></i> Home</a>
                <a class="nav-link" href="/register"><i class="bi bi-person-plus me-1"></i> Register</a>
            </div>
        </div>
    </nav>

    <main class="container auth-main py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="auth-mark"><i class="bi bi-shield-lock"></i></div>
                            <div class="auth-eyebrow mb-2">YOUR NEXT CHAPTER STARTS HERE</div>
                            <h1 class="h2 fw-bold">Welcome back</h1>
                            <p class="text-muted small">Sign in with your Student, Recruiter, or Admin credentials</p>
                        </div>

                        <!-- Feedback Alert -->
                        <div id="alert-box" class="alert d-none small mb-3" role="alert"></div>

                        <!-- Login Form -->
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold small">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" required placeholder="name@college.edu or name@company.com">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold small">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-muted"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" id="password" required placeholder="••••••••">
                                </div>
                            </div>

                            <button type="submit" id="submit-btn" class="btn auth-primary w-100 py-2 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                            </button>
                        </form>

                        <!-- Quick Demo Shortcuts -->
                        <div class="mt-4 pt-3 border-top">
                            <p class="text-muted small fw-semibold mb-2">Quick Demo Pre-fill:</p>
                            <div class="d-grid gap-2">
                                <button type="button" id="prefill-recruiter" class="btn btn-outline-success btn-sm text-start">
                                    <i class="bi bi-building-check me-1"></i> <strong>Recruiter:</strong> recruiter@company.com
                                </button>
                                <button type="button" id="prefill-student" class="btn btn-outline-primary btn-sm text-start">
                                    <i class="bi bi-mortarboard me-1"></i> <strong>Student:</strong> rahul@college.edu
                                </button>
                                <button type="button" id="prefill-admin" class="btn btn-outline-secondary btn-sm text-start">
                                    <i class="bi bi-shield-check me-1"></i> <strong>Admin:</strong> admin@college.edu
                                </button>
                            </div>
                        </div>

                        <div class="text-center mt-3 small">
                            <span class="text-muted">Don't have an account yet?</span>
                            <a href="/register" class="fw-semibold text-decoration-none">Create an account</a>
                        </div>
                    </div>
                </div>

                <!-- Session Active Card (visible if logged in) -->
                <div id="session-card" class="card shadow-sm border-0 mt-4 d-none">
                    <div class="card-body p-3 bg-white rounded">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="badge bg-success me-2">Authenticated</span>
                                <span id="session-role" class="fw-bold small text-capitalize"></span>
                            </div>
                            <button id="logout-btn" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-box-arrow-left me-1"></i> Logout
                            </button>
                        </div>
                        <p id="session-email" class="small text-muted mb-0 mt-2"></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { API_BASE, setToken, setUser, getToken, getUser, removeToken } from '../js/auth.js';

        const form = document.getElementById("login-form");
        const alertBox = document.getElementById("alert-box");
        const submitBtn = document.getElementById("submit-btn");
        const prefillAdminBtn = document.getElementById("prefill-admin");
        const prefillRecruiterBtn = document.getElementById("prefill-recruiter");
        const prefillStudentBtn = document.getElementById("prefill-student");
        const sessionCard = document.getElementById("session-card");
        const sessionRole = document.getElementById("session-role");
        const sessionEmail = document.getElementById("session-email");
        const logoutBtn = document.getElementById("logout-btn");

        function checkExistingSession() {
            const token = getToken();
            const user = getUser();
            if (token && user) {
                sessionCard.classList.remove("d-none");
                sessionRole.textContent = `Role: ${user.role}`;
                sessionEmail.textContent = `Signed in as: ${user.email}`;
            } else {
                sessionCard.classList.add("d-none");
            }
        }

        if (prefillRecruiterBtn) {
            prefillRecruiterBtn.addEventListener("click", () => {
                document.getElementById("email").value = "recruiter@company.com";
                document.getElementById("password").value = "Recruiter@123";
            });
        }

        if (prefillStudentBtn) {
            prefillStudentBtn.addEventListener("click", () => {
                document.getElementById("email").value = "rahul@college.edu";
                document.getElementById("password").value = "Student@123";
            });
        }

        if (prefillAdminBtn) {
            prefillAdminBtn.addEventListener("click", () => {
                document.getElementById("email").value = "admin@college.edu";
                document.getElementById("password").value = "Admin@12345";
            });
        }

        logoutBtn.addEventListener("click", () => {
            removeToken();
            checkExistingSession();
            showAlert("Logged out successfully.", "info");
        });

        async function parseResponse(res) {
            const contentType = res.headers.get("content-type");
            if (contentType && contentType.includes("application/json")) {
                return await res.json();
            }
            const text = await res.text();
            throw new Error(`Server returned HTTP ${res.status} (non-JSON). Verify Flask backend is running on port 5000.`);
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            alertBox.classList.add("d-none");
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing In...';

            const payload = {
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await parseResponse(res);

                if (res.ok) {
                    setToken(data.data.token);
                    setUser(data.data.user);
                    showAlert(`Login successful! Signed in as ${data.data.user.role.toUpperCase()}.`, "success");
                    checkExistingSession();
                    setTimeout(() => {
                        const role = data.data.user.role;
                        if (role === "student") {
                            window.location.href = "/student/dashboard";
                        } else if (role === "industry_expert" || role === "industry") {
                            window.location.href = "/recruiter/jobs";
                        } else if (role === "admin") {
                            window.location.href = "/admin/dashboard";
                        } else {
                            window.location.href = "/";
                        }
                    }, 1000);
                } else {
                    showAlert(data.message || "Invalid credentials.", "danger");
                }
            } catch (err) {
                showAlert(`Connection failed: ${err.message}. Make sure the Flask server is running.`, "danger");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
            }
        });

        function showAlert(msg, type) {
            alertBox.className = `alert alert-${type} small mb-3`;
            alertBox.textContent = msg;
            alertBox.classList.remove("d-none");
        }

        checkExistingSession();
    </script>
</body>
</html>
