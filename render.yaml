services:
  - type: web
    name: placement-career-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/deploy_init.py && gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 "backend.app:create_app('production')"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
